services:
  repro:
    build: .
    image: cellreprogramming-review-2026:latest
    working_dir: /repo
    volumes:
      - .:/repo

  run-offline:
    image: cellreprogramming-review-2026:latest
    working_dir: /repo
    volumes:
      - .:/repo
    command: bash scripts/run_offline.sh

  jupyter:
    image: cellreprogramming-review-2026:latest
    working_dir: /repo
    volumes:
      - .:/repo
    ports:
      - "8888:8888"
    command: >
      jupyter lab
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --NotebookApp.token=
      --NotebookApp.password=
